apiVersion: v1
kind: Secret
metadata:
  name: planner-api-secrets
  namespace: brightroom
type: Opaque
stringData:
  ConnectionStrings__Planner: Host=postgres;Port=5432;Database=planner;Username=planner_app;Password=replace-me
  Jwt__SigningKey: replace-me
  # Google Calendar integration (optional - feature self-disables when not configured)
  Google__ClientSecret: replace-me
  Google__TokenEncryptionKey: replace-me
